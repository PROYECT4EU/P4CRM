name: Validate P4CRM contract

on:
  push:
    branches:
      - master
      - feat/**
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate schema contract
        run: python scripts/validate_contract.py

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
